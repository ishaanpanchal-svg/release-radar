<text x="360" y="950" text-anchor="middle" font-size="13" fill="#6b6760">push = deploy</text>
<rect x="390" y="958" width="330" height="70" rx="10" fill="#e6f0fb" stroke="#1f5fa8" stroke-width="2.5"/>
<text x="555" y="987" text-anchor="middle" font-size="17" font-weight="700" fill="#123f73">Vercel (free plan)</text>
<text x="555" y="1011" text-anchor="middle" font-size="14.5" fill="#123f73" opacity="0.85">release-radar-red.vercel.app</text>
<path d="M720,993 L780,993" stroke="#6b7280" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="750" y="950" text-anchor="middle" font-size="13" fill="#6b6760">reads / writes</text>
<rect x="780" y="958" width="290" height="70" rx="10" fill="#e4f5ee" stroke="#0f7a5a" stroke-width="2.5"/>
<text x="925" y="987" text-anchor="middle" font-size="17" font-weight="700" fill="#0b4f3a">Supabase (free plan)</text>
<text x="925" y="1011" text-anchor="middle" font-size="14.5" fill="#0b4f3a" opacity="0.85">repos, digests, digest_items</text>
<rect x="1100" y="958" width="300" height="70" rx="10" fill="#eeeafc" stroke="#4f46c8" stroke-width="2.5"/>
<text x="1250" y="987" text-anchor="middle" font-size="17" font-weight="700" fill="#352b8f">External services</text>
<text x="1250" y="1011" text-anchor="middle" font-size="14.5" fill="#352b8f" opacity="0.85">GitHub API, Gemini Flash, Resend</text>
<text x="30" y="1056" font-size="15" fill="#33312d"><tspan font-weight="700">Schedule:</tspan> vercel.json cron 30 2 * * 1 = Monday 02:30 UTC = 08:00 IST. Vercel's free plan may fire it any time in that hour (the first real run was at 08:55). Needs CRON_SECRET; never sends twice in one week.</text>
<text x="30" y="1166" font-size="15" fill="#33312d"><tspan font-weight="700">How the judging works:</tspan> the fixed rules and Gemini each read the same release notes on their own. Only the Merge step combines their answers.</text>
<text x="30" y="1078" font-size="15" fill="#33312d"><tspan font-weight="700">AI:</tspan> every AI call is a Gemini Flash model (3.8, then 3.7, 3.6, 3.5 if one runs out). Free tier is 20 calls/day per model, so answers are cached per release.</text>
<text x="30" y="1100" font-size="15" fill="#33312d"><tspan font-weight="700">Safe to be wrong:</tspan> anything the AI or the rules disagree on is shown with a 'not sure' badge and is never green. If Gemini is down, rules still flag security and breaking.</text>
<text x="30" y="1122" font-size="15" fill="#33312d"><tspan font-weight="700">Left out on purpose:</tspan> issues, pull requests, comments, commit lists and alpha/beta/rc builds. The dashboard is public by design (no login).</text>
<text x="30" y="1144" font-size="15" fill="#33312d"><tspan font-weight="700">Not built:</tspan> Slack or Telegram delivery, per-user accounts, a custom sending domain (Resend free plan sends only to the signed-up address).</text>
<text x="717" y="1200" text-anchor="middle" font-size="16" fill="#6b6760">Release Radar: components map and deployment</text>
</svg>
